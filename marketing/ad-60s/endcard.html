<!-- End card for the ad, in the brand lockup from public/og.png: the Trekov mark
     (public/favicon.svg), the Outfit wordmark, the line and the URL.
     Render: ./render_endcard.sh  ->  assets/text/endcard.png (1080x1920) -->
<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: radial-gradient(ellipse 900px 1100px at 50% 40%, #0c3a2b 0%, #0a231b 38%, #080f0d 72%, #070a09 100%);
    font-family: "Outfit", ui-sans-serif, system-ui, sans-serif; color: #eef3f1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .lockup { display: flex; align-items: center; gap: 38px; margin-top: -120px; }
  .lockup svg { width: 176px; height: 176px; }
  .word { font-weight: 600; font-size: 200px; letter-spacing: -0.035em; line-height: 1; margin-top: -18px; }
  .line { font-weight: 600; font-size: 66px; color: #9fb2ab; margin-top: 96px; letter-spacing: -0.01em; }
  .features { font-weight: 500; font-size: 36px; color: #6d807a; margin-top: 26px; }
  .offer { margin-top: 70px; font-weight: 700; font-size: 58px; color: #fff; background: rgba(0,192,139,.16);
           border: 2px solid rgba(0,192,139,.5); border-radius: 22px; padding: 18px 40px; }
  .url { margin-top: 80px; padding: 30px 64px; border: 3px solid #00c08b; border-radius: 999px;
         font-weight: 600; font-size: 54px; letter-spacing: 0.22em; color: #00c08b; }
</style></head>
<body>
  <div class="lockup">
    <svg viewBox="0 0 64 64" role="img" aria-label="Trekov">
      <defs><linearGradient id="g" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3DDC97"/><stop offset=".55" stop-color="#00C08B"/><stop offset="1" stop-color="#0E9F6E"/>
      </linearGradient></defs>
      <path fill="url(#g)" fill-rule="evenodd" d="M32 61C32 61 53 40.5 53 25A21 21 0 1 0 11 25C11 40.5 32 61 32 61ZM17 34.5L26.5 20L31.5 28L37.5 11.5L47 34.5Z"/>
    </svg>
    <span class="word">trekov</span>
  </div>
  <div class="line">The map is the feed.</div>
  <div class="features">One route · Live group map · Push-to-talk</div>
  <div class="offer">Free till 31 October</div>
  <div class="url">TREKOV.COM</div>
</body></html>
